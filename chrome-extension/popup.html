<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Auto Clicker</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        font-family: Arial, sans-serif;
        width: 300px;
        background-color: rgb(24, 24, 24);
        color: white;
        padding: 10px;
        border: none;
      }
      .btnContainer {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
      }

      h3 {
        text-align: center;
      }
      .time-slot {
        width: 30%;
        background-color: #ff000038;
        /* color: black; */
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 5px 0;
        border: 1px solid red;
        border-radius: 15px;
        margin: 5px 2px;
      }

      #time-container {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        width: 100%;
        padding: 5px;
        justify-content: space-evenly;
        align-items: center;
      }
      .my-slots {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }
      h3 {
        margin: 5px 0;
      }

      /* The switch - the box around the slider */
      .switch {
        position: relative;
        display: inline-block;
        width: 30px;
        height: 17px;
      }
      .switchContainer {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 5px;
        width: 100%;
        margin-top: 10px;
      }

      /* Hide default HTML checkbox */
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      /* The slider */
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        -webkit-transition: 0.4s;
        transition: 0.4s;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 13px;
        width: 13px;
        left: 2px;
        bottom: 2px;
        background-color: white;
        -webkit-transition: 0.4s;
        transition: 0.4s;
      }

      input:checked + .slider {
        background-color: #2196f3;
      }

      #date-span {
        display: none;
      }

      input:checked + #date-span {
        display: block !important;
      }

      input:checked + .my-slots {
        display: flex !important;
      }

      input:focus + .slider {
        box-shadow: 0 0 1px #2196f3;
      }

      input:checked + .slider:before {
        -webkit-transform: translateX(13px);
        -ms-transform: translateX(13px);
        transform: translateX(13px);
      }

      /* Rounded sliders */
      .slider.round {
        border-radius: 17px;
      }

      .slider.round:before {
        border-radius: 50%;
      }

      #premium__token {
        width: 80%;
      }
      #is__premium {
        position: absolute;
        right: 2px;
        top: 2px;
      }
      .logo_img {
        position: absolute;
        left: 10px;
        top: 5px;
        width: 40px;
      }
      .buttonContainer {
        display: none;
        margin: 20px 0px;
        justify-content: center;
        align-items: center;
        width: 100%;
        flex-direction: column-reverse;
      }
      .buttonContainer > p {
        font-size: 18px;
        text-align: center;
      }
      .buttonContainer > button {
        background-color: yellowgreen;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background-color 0.3s ease;
      }
      .buttonContainer > button:hover {
        background-color: #45a049;
        cursor: pointer;
      }
      #buy_premium,
      #openEbrama {
        width: 50%;
        padding: 10px;
        display: none;
      }
      .switch__container {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #onoff {
        margin: 0;
        margin-left: 5px;
        font-weight: bold;
        letter-spacing: 1.2px;
      }
    </style>
  </head>
  <body>
    <img src="./images/ACLogoNoText.png" alt="logo" class="logo_img" />
    <h3>Auto Clicker</h3>
    <span id="is__premium"></span>

    <div class="buttonContainer">
      <button id="buy_premium">Kup premium</button>
      <button id="openEbrama">Wejdź na stronę</button>
    </div>
    <p id="date-span"><span id="data"></span></p>

    <div class="my-slots"></div>

    <div class="switchContainer">
      <span id="token"></span>
      <div class="switch__container">
        <label class="switch">
          <input type="checkbox" id="my-check" />
          <span class="slider round"></span>
        </label>
        <p id="onoff"></p>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
